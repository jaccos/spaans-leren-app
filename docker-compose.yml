services:
  # Ollama service - draait de LLM modellen
  ollama:
    image: ollama/ollama:latest
    container_name: spaans-leren-ollama
    ports:
      - "11434:11434"
    volumes:
      # Persistent storage voor modellen (~12GB voor qwen + mistral)
      - ollama-data:/root/.ollama
    restart: unless-stopped
    # Voor Apple Silicon M3 Pro optimalisatie
    environment:
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=10m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build: ./backend
    container_name: spaans-leren-backend
    # Port niet meer exposed - alleen via nginx reverse proxy
    expose:
      - "8002"
    volumes:
      # Mount source code for hot-reload (development) - includes .env
      - ./backend:/app
      # Persistent database volume in dedicated directory
      - spaans-db:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      # Ollama host: gebruik service naam (Docker internal networking)
      - OLLAMA_HOST=ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    # Resource limits for security and stability
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Nginx reverse proxy - enige publieke entry point
  nginx:
    build: ./frontend
    container_name: spaans
    labels:
      dev.orbstack.domains: "spaans.local"
    ports:
      - "80:80"
    volumes:
      # Nginx configuratie
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Frontend static files (hot-reload voor development)
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - backend
    restart: unless-stopped
    # Resource limits for nginx
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

volumes:
  # Named volume for SQLite database persistence
  spaans-db:
    name: spaans-leren-db

  # Named volume for Ollama models persistence
  ollama-data:
    name: spaans-leren-ollama
