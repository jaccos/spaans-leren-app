<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaans Leren</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary: #1e40af;
            --primary-dark: #1e3a8a;
            --secondary: #64748b;
            --accent: #0ea5e9;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --bg: #f8fafc;
            --text: #0f172a;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .card-hover {
            transition: all 0.2s ease;
        }

        .card-hover:hover {
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // API_BASE is now relative - Nginx reverse proxy handles routing
        const API_BASE = '/api';

        function App() {
            const [words, setWords] = useState([]);
            const [dueWords, setDueWords] = useState([]);
            const [loading, setLoading] = useState(false);
            const [activeTab, setActiveTab] = useState('add');
            const [searchTerm, setSearchTerm] = useState('');
            const [dutchWord, setDutchWord] = useState('');
            const [flashcardIndex, setFlashcardIndex] = useState(0);
            const [showAnswer, setShowAnswer] = useState(false);
            const [stats, setStats] = useState({ total_words: 0, total_categories: 0 });
            const [reviewStats, setReviewStats] = useState({ due_today: 0, learning: 0, mastered: 0, total_reviews_today: 0 });
            const [streakData, setStreakData] = useState({ current_streak: 0, longest_streak: 0 });
            const [heatmapData, setHeatmapData] = useState([]);
            const [selectedWord, setSelectedWord] = useState(null);
            const [notification, setNotification] = useState(null);
            const [seenToday, setSeenToday] = useState(0); // Track reviewed today
            const [dailyGoal, setDailyGoal] = useState(20); // Daily review goal
            const [sessionStartTime, setSessionStartTime] = useState(null); // Session timer
            const [wordHistory, setWordHistory] = useState(null); // Selected word history
            const [historyWord, setHistoryWord] = useState(null); // Word being viewed in history modal

            // Active recall state
            const [typeModeEnabled, setTypeModeEnabled] = useState(true); // Toggle type mode
            const [userAnswer, setUserAnswer] = useState(''); // User's typed answer
            const [isChecked, setIsChecked] = useState(false); // Has user checked their answer
            const [checkResult, setCheckResult] = useState(null); // 'correct', 'close', 'wrong'

            // Listening practice state
            const [listeningChallenge, setListeningChallenge] = useState(null); // Current challenge
            const [listeningAnswer, setListeningAnswer] = useState(''); // User's listening answer
            const [listeningFeedback, setListeningFeedback] = useState(null); // Feedback after check
            const [listeningLoading, setListeningLoading] = useState(false); // Loading new challenge

            // Quiz (Multiple Choice) state
            const [quizQuestion, setQuizQuestion] = useState(null); // Current quiz question
            const [quizSelectedOption, setQuizSelectedOption] = useState(null); // Selected option index
            const [quizFeedback, setQuizFeedback] = useState(null); // Feedback after check
            const [quizLoading, setQuizLoading] = useState(false); // Loading new question
            const [practiceMode, setPracticeMode] = useState(null); // 'listening' or 'quiz'

            // Ref for input field auto-focus
            const dutchWordInputRef = useRef(null);
            const listeningInputRef = useRef(null);
            const reviewInputRef = useRef(null);

            // Helper function to insert Spanish character at cursor position (Listening Practice)
            const insertSpanishChar = (char) => {
                const input = listeningInputRef.current;
                if (!input) return;

                const start = input.selectionStart;
                const end = input.selectionEnd;
                const text = listeningAnswer;
                const before = text.substring(0, start);
                const after = text.substring(end);

                setListeningAnswer(before + char + after);

                // Set cursor position after inserted character
                setTimeout(() => {
                    input.focus();
                    input.setSelectionRange(start + 1, start + 1);
                }, 0);
            };

            // Helper function to insert Spanish character at cursor position (Review Type Mode)
            const insertSpanishCharReview = (char) => {
                const input = reviewInputRef.current;
                if (!input) return;

                const start = input.selectionStart;
                const end = input.selectionEnd;
                const text = userAnswer;
                const before = text.substring(0, start);
                const after = text.substring(end);

                setUserAnswer(before + char + after);

                // Set cursor position after inserted character
                setTimeout(() => {
                    input.focus();
                    input.setSelectionRange(start + 1, start + 1);
                }, 0);
            };

            // ESC key handler
            useEffect(() => {
                const handleEscape = (e) => {
                    if (e.key === 'Escape') {
                        if (historyWord) {
                            setHistoryWord(null);
                            setWordHistory(null);
                        } else if (selectedWord) {
                            closeModal();
                        }
                    }
                };
                window.addEventListener('keydown', handleEscape);
                return () => window.removeEventListener('keydown', handleEscape);
            }, [selectedWord, historyWord, activeTab]);

            useEffect(() => {
                if (activeTab === 'list' || activeTab === 'review') {
                    loadWords();
                }
                if (activeTab === 'review') {
                    loadDueWords();
                }
                if (activeTab === 'stats') {
                    loadHeatmap();
                }
                loadStats();
                loadReviewStats();
                loadStreak();
            }, [activeTab]);

            const loadWords = async () => {
                try {
                    const response = await fetch(`${API_BASE}/words/`);
                    const data = await response.json();
                    setWords(data);
                } catch (error) {
                    console.error('Error loading words:', error);
                }
            };

            const loadDueWords = async () => {
                try {
                    const response = await fetch(`${API_BASE}/words/due`);
                    const data = await response.json();
                    setDueWords(data);
                    if (data.length > 0) {
                        setFlashcardIndex(0);
                        setShowAnswer(false);
                    }
                } catch (error) {
                    console.error('Error loading due words:', error);
                }
            };

            const loadStats = async () => {
                try {
                    const response = await fetch(`${API_BASE}/stats/`);
                    const data = await response.json();
                    setStats(data);
                } catch (error) {
                    console.error('Error loading stats:', error);
                }
            };

            const loadReviewStats = async () => {
                try {
                    const response = await fetch(`${API_BASE}/stats/reviews`);
                    const data = await response.json();
                    setReviewStats(data);
                    setSeenToday(data.total_reviews_today);
                } catch (error) {
                    console.error('Error loading review stats:', error);
                }
            };

            const loadStreak = async () => {
                try {
                    const response = await fetch(`${API_BASE}/stats/streak`);
                    const data = await response.json();
                    setStreakData(data);
                } catch (error) {
                    console.error('Error loading streak:', error);
                }
            };

            const loadHeatmap = async () => {
                try {
                    const response = await fetch(`${API_BASE}/stats/heatmap?days=30`);
                    const data = await response.json();
                    setHeatmapData(data);
                } catch (error) {
                    console.error('Error loading heatmap:', error);
                }
            };

            const loadWordHistory = async (wordId) => {
                try {
                    // Get word details
                    const wordResponse = await fetch(`${API_BASE}/words/${wordId}`);
                    const wordData = await wordResponse.json();
                    setHistoryWord(wordData);

                    // Get history
                    const historyResponse = await fetch(`${API_BASE}/words/${wordId}/history`);
                    const historyData = await historyResponse.json();
                    setWordHistory(historyData);
                } catch (error) {
                    console.error('Error loading word history:', error);
                }
            };

            const playAudio = async (wordId) => {
                try {
                    const response = await fetch(`${API_BASE}/words/${wordId}/audio`);
                    const data = await response.json();

                    // Create and play audio from data URL
                    const audio = new Audio(data.audio_data);
                    await audio.play();
                } catch (error) {
                    console.error('Error playing audio:', error);
                    setNotification({ type: 'error', message: '🔊 Audio kon niet afgespeeld worden' });
                    setTimeout(() => setNotification(null), 3000);
                }
            };

            const getLeitnerBoxInfo = (box) => {
                const boxInfo = {
                    0: { label: 'Nieuw', emoji: '🆕', colors: 'from-gray-400 to-gray-500' },
                    1: { label: 'Leren', emoji: '📚', colors: 'from-red-400 to-red-500' },
                    2: { label: 'Bekend', emoji: '📖', colors: 'from-orange-400 to-orange-500' },
                    3: { label: 'Goed', emoji: '✅', colors: 'from-yellow-400 to-yellow-500' },
                    4: { label: 'Sterk', emoji: '💪', colors: 'from-green-400 to-green-500' },
                    5: { label: 'Meester', emoji: '🏆', colors: 'from-blue-400 to-blue-500' }
                };
                return boxInfo[box] || boxInfo[0];
            };

            const loadListeningChallenge = async () => {
                setListeningLoading(true);
                setListeningFeedback(null);
                setListeningAnswer('');

                try {
                    const response = await fetch(`${API_BASE}/practice/listening`);
                    const data = await response.json();
                    setListeningChallenge(data);
                } catch (error) {
                    console.error('Error loading listening challenge:', error);
                    setNotification({ type: 'error', message: '❌ Kon geen luisteroefening laden' });
                    setTimeout(() => setNotification(null), 3000);
                } finally {
                    setListeningLoading(false);
                }
            };

            const checkListeningAnswer = async () => {
                if (!listeningAnswer.trim()) {
                    setNotification({ type: 'error', message: 'Voer eerst een antwoord in! 📝' });
                    setTimeout(() => setNotification(null), 3000);
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE}/practice/listening/check`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            word_id: listeningChallenge.word_id,
                            user_answer: listeningAnswer
                        })
                    });

                    const feedback = await response.json();
                    setListeningFeedback(feedback);
                } catch (error) {
                    console.error('Error checking answer:', error);
                    setNotification({ type: 'error', message: '❌ Kon antwoord niet checken' });
                    setTimeout(() => setNotification(null), 3000);
                }
            };

            // Quiz (Multiple Choice) functions
            const loadQuizQuestion = async () => {
                setQuizLoading(true);
                setQuizFeedback(null);
                setQuizSelectedOption(null);

                try {
                    const response = await fetch(`${API_BASE}/practice/quiz`);
                    const data = await response.json();
                    setQuizQuestion(data);
                } catch (error) {
                    console.error('Error loading quiz question:', error);
                    setNotification({ type: 'error', message: '❌ Kon geen quiz vraag laden' });
                    setTimeout(() => setNotification(null), 3000);
                } finally {
                    setQuizLoading(false);
                }
            };

            const checkQuizAnswer = async () => {
                if (quizSelectedOption === null) {
                    setNotification({ type: 'error', message: 'Selecteer eerst een antwoord! 📝' });
                    setTimeout(() => setNotification(null), 3000);
                    return;
                }

                const selectedAnswer = quizQuestion.options[quizSelectedOption];

                try {
                    const response = await fetch(`${API_BASE}/practice/quiz/check`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            word_id: quizQuestion.word_id,
                            selected_answer: selectedAnswer,
                            correct_answer: quizQuestion.correct_answer
                        })
                    });

                    const feedback = await response.json();
                    setQuizFeedback(feedback);

                    // Haal het volledige woord op om de modal te tonen
                    const wordResponse = await fetch(`${API_BASE}/words/${quizQuestion.word_id}`);
                    const wordData = await wordResponse.json();

                    // Toon de modal met het volledige woord na 1 seconde (zodat gebruiker eerst feedback ziet)
                    setTimeout(() => {
                        setSelectedWord(wordData);
                    }, 1500);
                } catch (error) {
                    console.error('Error checking quiz answer:', error);
                    setNotification({ type: 'error', message: '❌ Kon antwoord niet checken' });
                    setTimeout(() => setNotification(null), 3000);
                }
            };

            const handleAddWord = async (e) => {
                e.preventDefault();
                if (!dutchWord.trim()) {
                    setNotification({ type: 'error', message: 'Voer een Nederlands woord in! 📝' });
                    setTimeout(() => setNotification(null), 3000);
                    return;
                }

                setLoading(true);
                try {
                    const response = await fetch(`${API_BASE}/words/`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ dutch_word: dutchWord })
                    });

                    if (!response.ok) throw new Error('API request failed');

                    const newWord = await response.json();

                    // Check if duplicate or new word
                    if (newWord.is_duplicate) {
                        // Duplicate word - show info notification
                        setNotification({
                            type: 'info',
                            message: `ℹ️ "${newWord.spanish_word}" bestaat al! Bekijk de visualisatie 👇`
                        });
                        // Don't add to list (avoid UI duplicates)
                    } else {
                        // New word - add to list
                        setWords([newWord, ...words]);
                        setNotification({
                            type: 'success',
                            message: `✨ "${newWord.spanish_word}" toegevoegd! Bekijk de visualisatie 👇`
                        });
                    }

                    setDutchWord('');
                    setTimeout(() => setNotification(null), 5000);

                    // Always show visualization modal (stay in 'add' tab)
                    setSelectedWord(newWord);
                } catch (error) {
                    console.error('Error adding word:', error);
                    setNotification({ type: 'error', message: '❌ Fout bij toevoegen. Check de backend!' });
                    setTimeout(() => setNotification(null), 3000);
                } finally {
                    setLoading(false);
                }
            };

            const handleDeleteWord = async (id) => {
                if (!confirm('🗑️ Weet je zeker dat je dit woord wilt verwijderen?')) return;
                try {
                    await fetch(`${API_BASE}/words/${id}`, { method: 'DELETE' });
                    setWords(words.filter(w => w.id !== id));
                } catch (error) {
                    console.error('Error deleting word:', error);
                }
            };

            const filteredWords = words.filter(word =>
                word.dutch_word.toLowerCase().includes(searchTerm.toLowerCase()) ||
                word.spanish_word.toLowerCase().includes(searchTerm.toLowerCase())
            );

            const closeModal = () => {
                setSelectedWord(null);

                // If we're in quiz mode, load a new question instead of going to add tab
                if (activeTab === 'practice' && practiceMode === 'quiz' && quizFeedback) {
                    // Reset feedback and load new question
                    setQuizFeedback(null);
                    setQuizSelectedOption(null);
                    loadQuizQuestion();
                } else {
                    // Default behavior: return to 'add' tab and focus input field
                    setActiveTab('add');
                    setTimeout(() => {
                        dutchWordInputRef.current?.focus();
                    }, 100);
                }
            };

            const startReview = () => {
                loadDueWords();
                setActiveTab('review');
                // Reset answer state
                setUserAnswer('');
                setIsChecked(false);
                setCheckResult(null);
            };

            // Levenshtein distance for fuzzy matching
            const levenshteinDistance = (str1, str2) => {
                const track = Array(str2.length + 1).fill(null).map(() =>
                    Array(str1.length + 1).fill(null));
                for (let i = 0; i <= str1.length; i += 1) {
                    track[0][i] = i;
                }
                for (let j = 0; j <= str2.length; j += 1) {
                    track[j][0] = j;
                }
                for (let j = 1; j <= str2.length; j += 1) {
                    for (let i = 1; i <= str1.length; i += 1) {
                        const indicator = str1[i - 1] === str2[j - 1] ? 0 : 1;
                        track[j][i] = Math.min(
                            track[j][i - 1] + 1,
                            track[j - 1][i] + 1,
                            track[j - 1][i - 1] + indicator,
                        );
                    }
                }
                return track[str2.length][str1.length];
            };

            const checkAnswer = () => {
                if (!dueWords[flashcardIndex]) return;

                const correctAnswer = dueWords[flashcardIndex].spanish_word.toLowerCase().trim();
                const userAttempt = userAnswer.toLowerCase().trim();

                // Exact match
                if (userAttempt === correctAnswer) {
                    setCheckResult('correct');
                    setIsChecked(true);
                    setShowAnswer(true);
                    return;
                }

                // Fuzzy match - allow 1-2 character difference
                const distance = levenshteinDistance(userAttempt, correctAnswer);
                const maxAllowedDistance = correctAnswer.length <= 4 ? 1 : 2;

                if (distance <= maxAllowedDistance) {
                    setCheckResult('close');
                } else {
                    setCheckResult('wrong');
                }

                setIsChecked(true);
                setShowAnswer(true);
            };

            const submitReview = async (quality) => {
                if (dueWords.length === 0) return;

                const currentWord = dueWords[flashcardIndex];
                try {
                    const response = await fetch(`${API_BASE}/reviews/`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            word_id: currentWord.id,
                            quality: quality
                        })
                    });

                    if (!response.ok) throw new Error('Failed to submit review');

                    // Update stats
                    await loadReviewStats();
                    await loadStreak();

                    // Remove reviewed word from due list
                    const newDueWords = dueWords.filter((_, i) => i !== flashcardIndex);
                    setDueWords(newDueWords);

                    // Reset answer state for next card
                    setUserAnswer('');
                    setIsChecked(false);
                    setCheckResult(null);
                    setShowAnswer(false);

                    // Move to next card or show completion
                    if (newDueWords.length > 0) {
                        setFlashcardIndex(0);
                    } else {
                        // All done!
                        setNotification({
                            type: 'success',
                            message: '🎉 Alle kaarten voor vandaag gedaan! Goed bezig! 🔥'
                        });
                        setTimeout(() => {
                            setNotification(null);
                            setActiveTab('stats');
                        }, 3000);
                    }
                } catch (error) {
                    console.error('Error submitting review:', error);
                    setNotification({ type: 'error', message: '❌ Fout bij opslaan review' });
                    setTimeout(() => setNotification(null), 3000);
                }
            };

            return (
                <div className="min-h-screen pb-12">
                    {/* Professional Header */}
                    <div className="bg-white border-b border-gray-200 py-6 px-4 shadow-sm">
                        <div className="max-w-6xl mx-auto">
                            <div className="flex items-center justify-between mb-6">
                                <div>
                                    <h1 className="text-3xl font-bold text-gray-900 mb-1">Spaans Leren</h1>
                                    <p className="text-gray-600">Vocabulaire training met spaced repetition</p>
                                </div>
                            </div>

                            <div className="grid grid-cols-4 gap-4">
                                <div className="bg-white border border-gray-200 rounded-lg px-5 py-3 card-hover">
                                    <p className="text-sm text-gray-600 mb-1">Woorden</p>
                                    <p className="text-2xl font-semibold text-gray-900">{stats.total_words}</p>
                                </div>
                                <div className="bg-white border border-gray-200 rounded-lg px-5 py-3 card-hover">
                                    <p className="text-sm text-gray-600 mb-1">Streak</p>
                                    <p className="text-2xl font-semibold text-gray-900">{streakData.current_streak} dagen</p>
                                </div>
                                <div className="bg-white border border-gray-200 rounded-lg px-5 py-3 card-hover">
                                    <p className="text-sm text-gray-600 mb-1">Te herhalen</p>
                                    <p className="text-2xl font-semibold text-gray-900">{reviewStats.due_today}</p>
                                </div>
                                <div className="bg-white border border-gray-200 rounded-lg px-5 py-3 card-hover">
                                    <p className="text-sm text-gray-600 mb-1">Vandaag</p>
                                    <p className="text-2xl font-semibold text-gray-900">{reviewStats.total_reviews_today}</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-6xl mx-auto px-4 mt-8">
                        {/* Tab Navigation */}
                        <div className="bg-white border border-gray-200 rounded-lg mb-8 overflow-hidden shadow-sm">
                            <div className="grid grid-cols-5 gap-0">
                                <button
                                    onClick={() => setActiveTab('add')}
                                    className={`px-6 py-4 font-semibold text-base flex items-center justify-center transition-all border-b-2 ${
                                        activeTab === 'add'
                                            ? 'bg-blue-50 text-blue-700 border-blue-700'
                                            : 'text-gray-600 hover:bg-gray-50 border-transparent'
                                    }`}
                                >
                                    Toevoegen
                                </button>
                                <button
                                    onClick={() => setActiveTab('list')}
                                    className={`px-6 py-4 font-semibold text-base flex items-center justify-center transition-all border-b-2 ${
                                        activeTab === 'list'
                                            ? 'bg-blue-50 text-blue-700 border-blue-700'
                                            : 'text-gray-600 hover:bg-gray-50 border-transparent'
                                    }`}
                                >
                                    Lijst
                                </button>
                                <button
                                    onClick={startReview}
                                    className={`px-6 py-4 font-semibold text-base flex items-center justify-center transition-all relative border-b-2 ${
                                        activeTab === 'review'
                                            ? 'bg-blue-50 text-blue-700 border-blue-700'
                                            : 'text-gray-600 hover:bg-gray-50 border-transparent'
                                    }`}
                                >
                                    Review
                                    {reviewStats.due_today > 0 && (
                                        <span className="ml-2 bg-red-500 text-white text-xs font-semibold px-2 py-0.5 rounded-full">
                                            {reviewStats.due_today}
                                        </span>
                                    )}
                                </button>
                                <button
                                    onClick={() => setActiveTab('practice')}
                                    className={`px-6 py-4 font-semibold text-base flex items-center justify-center transition-all border-b-2 ${
                                        activeTab === 'practice'
                                            ? 'bg-blue-50 text-blue-700 border-blue-700'
                                            : 'text-gray-600 hover:bg-gray-50 border-transparent'
                                    }`}
                                >
                                    Oefenen
                                </button>
                                <button
                                    onClick={() => setActiveTab('stats')}
                                    className={`px-6 py-4 font-semibold text-base flex items-center justify-center transition-all border-b-2 ${
                                        activeTab === 'stats'
                                            ? 'bg-blue-50 text-blue-700 border-blue-700'
                                            : 'text-gray-600 hover:bg-gray-50 border-transparent'
                                    }`}
                                >
                                    Statistieken
                                </button>
                            </div>
                        </div>

                        {/* Add Word Tab */}
                        {activeTab === 'add' && (
                            <div className="bg-white border border-gray-200 rounded-lg shadow-sm p-8 mb-8">
                                <div className="max-w-2xl mx-auto">
                                    <h2 className="text-2xl font-bold text-gray-900 mb-2">Nieuw woord toevoegen</h2>
                                    <p className="text-gray-600 mb-6">Voer een Nederlands woord in. De AI genereert automatisch de vertaling, categorie en geheugensteun.</p>

                                    <form onSubmit={handleAddWord} className="space-y-4">
                                        <div>
                                            <input
                                                ref={dutchWordInputRef}
                                                type="text"
                                                value={dutchWord}
                                                onChange={(e) => setDutchWord(e.target.value)}
                                                placeholder="Bijv. huis, kat, lopen, mooi..."
                                                className="w-full px-4 py-3 text-lg border border-gray-300 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none"
                                                disabled={loading}
                                                autoFocus
                                            />
                                        </div>

                                        <button
                                            type="submit"
                                            disabled={loading}
                                            className="w-full px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                                        >
                                            {loading ? (
                                                <span>Bezig met verwerken...</span>
                                            ) : (
                                                <span>Woord toevoegen</span>
                                            )}
                                        </button>

                                        {loading && (

                                    )}

                                    {/* Grammatica Info */}
                                    <div className="mt-8 bg-white rounded-lg shadow-sm border border-gray-200 p-8 max-w-3xl mx-auto">
                                        {/* Werkwoord Vervoegingen */}
                                        {selectedWord.conjugations && (
                                                <div>
                                                    <h3 className="text-xl font-bold text-gray-900 mb-4">
                                                        Vervoegingen (Presente)
                                                    </h3>
                                                    <div className="grid grid-cols-2 gap-3">
                                                        <div className="bg-gray-50 border border-gray-200 p-4 rounded-lg">
                                                            <span className="font-semibold text-gray-700">yo:</span>
                                                            <span className="ml-2 text-base text-gray-900 font-semibold">{selectedWord.conjugations.yo}</span>
                                                        </div>
                                                        <div className="bg-gray-50 border border-gray-200 p-4 rounded-lg">
                                                            <span className="font-semibold text-gray-700">tú:</span>
                                                            <span className="ml-2 text-base text-gray-900 font-semibold">{selectedWord.conjugations['tú']}</span>
                                                        </div>
                                                        <div className="bg-gray-50 border border-gray-200 p-4 rounded-lg">
                                                            <span className="font-semibold text-gray-700">él/ella:</span>
                                                            <span className="ml-2 text-base text-gray-900 font-semibold">{selectedWord.conjugations['él/ella']}</span>
                                                        </div>
                                                        <div className="bg-gray-50 border border-gray-200 p-4 rounded-lg">
                                                            <span className="font-semibold text-gray-700">nosotros:</span>
                                                            <span className="ml-2 text-base text-gray-900 font-semibold">{selectedWord.conjugations.nosotros}</span>
                                                        </div>
                                                        <div className="bg-gray-50 border border-gray-200 p-4 rounded-lg">
                                                            <span className="font-semibold text-gray-700">vosotros:</span>
                                                            <span className="ml-2 text-base text-gray-900 font-semibold">{selectedWord.conjugations.vosotros}</span>
                                                        </div>
                                                        <div className="bg-gray-50 border border-gray-200 p-4 rounded-lg">
                                                            <span className="font-semibold text-gray-700">ellos/ellas:</span>
                                                            <span className="ml-2 text-base text-gray-900 font-semibold">{selectedWord.conjugations['ellos/ellas']}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                            {/* Zelfstandig Naamwoord Vormen */}
                                            {selectedWord.forms && selectedWord.forms.singular && (
                                                <div className={selectedWord.conjugations ? 'mt-6' : ''}>
                                                    <h3 className="text-xl font-bold text-gray-900 mb-4">
                                                        Enkelvoud & Meervoud
                                                    </h3>
                                                    <div className="grid grid-cols-2 gap-4">
                                                        <div className="bg-gray-50 border border-gray-200 p-6 rounded-lg">
                                                            <span className="block text-sm font-semibold text-gray-600 mb-1">Enkelvoud</span>
                                                            <span className="text-xl text-gray-900 font-semibold">{selectedWord.forms.singular}</span>
                                                        </div>
                                                        <div className="bg-gray-50 border border-gray-200 p-6 rounded-lg">
                                                            <span className="block text-sm font-semibold text-gray-600 mb-1">Meervoud</span>
                                                            <span className="text-xl text-gray-900 font-semibold">{selectedWord.forms.plural}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                            {/* Bijvoeglijk Naamwoord Vormen */}
                                            {selectedWord.forms && selectedWord.forms.masculine && (
                                                <div className={selectedWord.conjugations ? 'mt-6' : ''}>
                                                    <h3 className="text-xl font-bold text-gray-900 mb-4">
                                                        Mannelijk & Vrouwelijk
                                                    </h3>
                                                    <div className="grid grid-cols-2 gap-4">
                                                        <div className="bg-gray-50 border border-gray-200 p-6 rounded-lg">
                                                            <span className="block text-sm font-semibold text-gray-600 mb-1">Mannelijk</span>
                                                            <span className="text-xl text-gray-900 font-semibold">{selectedWord.forms.masculine}</span>
                                                        </div>
                                                        <div className="bg-gray-50 border border-gray-200 p-6 rounded-lg">
                                                            <span className="block text-sm font-semibold text-gray-600 mb-1">Vrouwelijk</span>
                                                            <span className="text-xl text-gray-900 font-semibold">{selectedWord.forms.feminine}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                        {/* Als geen conjugations of forms */}
                                        {!selectedWord.conjugations && !selectedWord.forms && (
                                            <p className="text-gray-500 text-center italic">
                                                Geen grammatica informatie beschikbaar voor dit woord
                                            </p>
                                        )}
                                    </div>

                                    {/* Voorbeeldzinnen */}
                                    {selectedWord.example_sentences && selectedWord.example_sentences.length > 0 && (
                                        <div className="mt-6 bg-white border border-gray-200 rounded-lg shadow-sm p-8 max-w-3xl mx-auto">
                                            <h3 className="text-xl font-bold text-gray-900 mb-6">
                                                Voorbeeldzinnen
                                            </h3>
                                            <div className="space-y-4">
                                                {selectedWord.example_sentences.map((sentence, index) => (
                                                    <div key={index} className="bg-gray-50 border border-gray-200 rounded-lg p-5">
                                                        <p className="text-base font-semibold text-gray-800 mb-2">{sentence.spanish}</p>
                                                        <p className="text-sm text-gray-600 italic">{sentence.dutch}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* Gerelateerde Woorden */}
                                    {selectedWord.related_words && (
                                        <div className="mt-6 bg-white border border-gray-200 rounded-lg shadow-sm p-8 max-w-3xl mx-auto">
                                            <h3 className="text-xl font-bold text-gray-900 mb-6">
                                                Gerelateerde Woorden
                                            </h3>
                                            <div className="space-y-4">
                                                {selectedWord.related_words.synonyms && selectedWord.related_words.synonyms.length > 0 && (
                                                    <div className="bg-gray-50 border border-gray-200 rounded-lg p-5">
                                                        <h4 className="text-base font-bold text-gray-700 mb-3">
                                                            Synoniemen
                                                        </h4>
                                                        <div className="flex flex-wrap gap-2">
                                                            {selectedWord.related_words.synonyms.map((word, index) => (
                                                                <span key={index} className="bg-blue-100 text-blue-800 px-4 py-2 rounded-lg font-medium text-sm border border-blue-200">
                                                                    {word}
                                                                </span>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}

                                                {selectedWord.related_words.antonyms && selectedWord.related_words.antonyms.length > 0 && (
                                                    <div className="bg-gray-50 border border-gray-200 rounded-lg p-5">
                                                        <h4 className="text-base font-bold text-gray-700 mb-3">
                                                            Antoniemen
                                                        </h4>
                                                        <div className="flex flex-wrap gap-2">
                                                            {selectedWord.related_words.antonyms.map((word, index) => (
                                                                <span key={index} className="bg-red-100 text-red-800 px-4 py-2 rounded-lg font-medium text-sm border border-red-200">
                                                                    {word}
                                                                </span>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}

                                                {selectedWord.related_words.family && selectedWord.related_words.family.length > 0 && (
                                                    <div className="bg-gray-50 border border-gray-200 rounded-lg p-5">
                                                        <h4 className="text-base font-bold text-gray-700 mb-3">
                                                            Woordfamilie
                                                        </h4>
                                                        <div className="flex flex-wrap gap-2">
                                                            {selectedWord.related_words.family.map((word, index) => (
                                                                <span key={index} className="bg-purple-100 text-purple-800 px-4 py-2 rounded-lg font-medium text-sm border border-purple-200">
                                                                    {word}
                                                                </span>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}

                                    <div className="mt-6 text-center">
                                        <p className="text-white text-base font-medium bg-black bg-opacity-60 px-6 py-3 rounded-lg inline-block">
                                            Klik ergens of druk <kbd className="bg-white text-black px-2 py-1 rounded font-mono">ESC</kbd> om te sluiten
                                        </p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Notificatie - bovenaan scherm */}
                        {notification && (
                            <div
                                className={`fixed top-8 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-lg shadow-sm border font-semibold text-base max-w-2xl cursor-pointer transition-all ${
                                    notification.type === 'success'
                                        ? 'bg-green-50 text-green-800 border-green-200'
                                        : notification.type === 'info'
                                        ? 'bg-blue-50 text-blue-800 border-blue-200'
                                        : 'bg-red-50 text-red-800 border-red-200'
                                }`}
                                onClick={() => setNotification(null)}
                            >
                                {notification.message}
                            </div>
                        )}

                        {/* History Modal */}
                        {historyWord && wordHistory && (
                            <div
                                className="fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center z-50 p-8 backdrop-blur-sm overflow-y-auto"
                                onClick={() => {
                                    setHistoryWord(null);
                                    setWordHistory(null);
                                }}
                            >
                                <div
                                    className="relative max-w-4xl w-full my-8 bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden"
                                    onClick={(e) => e.stopPropagation()}
                                >
                                    {/* Header */}
                                    <div className="bg-gray-50 border-b border-gray-200 p-8">
                                        <div className="flex items-center justify-between mb-4">
                                            <div className="flex items-center gap-4">
                                                <div>
                                                    <h2 className="text-3xl font-bold text-gray-900 mb-2">{historyWord.spanish_word}</h2>
                                                    <p className="text-xl text-gray-700">{historyWord.dutch_word}</p>
                                                </div>
                                                <button
                                                    onClick={() => playAudio(historyWord.id)}
                                                    className="text-blue-600 hover:text-blue-800 bg-white border border-gray-300 hover:bg-gray-50 px-3 py-2 rounded-lg transition-colors"
                                                    title="Luister uitspraak"
                                                >
                                                    <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                                                        <path d="M10 3.5a.5.5 0 00-.5-.5h-2a.5.5 0 00-.5.5v13a.5.5 0 00.5.5h2a.5.5 0 00.5-.5v-13zM15.5 7a.5.5 0 01.5.5v5a.5.5 0 01-.5.5h-2a.5.5 0 01-.5-.5v-5a.5.5 0 01.5-.5h2z"/>
                                                    </svg>
                                                </button>
                                            </div>
                                            <button
                                                onClick={() => {
                                                    setHistoryWord(null);
                                                    setWordHistory(null);
                                                }}
                                                className="bg-white border border-gray-300 hover:bg-gray-100 px-4 py-2 rounded-lg font-semibold text-gray-700 transition-colors"
                                            >
                                                Sluiten
                                            </button>
                                        </div>

                                        {/* Quick Stats */}
                                        <div className="grid grid-cols-4 gap-4 mt-6">
                                            <div className="bg-white border border-gray-200 rounded-lg p-4 text-center">
                                                <div className="text-2xl font-bold text-gray-900">{historyWord.review_count}</div>
                                                <div className="text-sm text-gray-600">Total Reviews</div>
                                            </div>
                                            <div className="bg-white border border-gray-200 rounded-lg p-4 text-center">
                                                <div className="text-2xl font-bold text-gray-900">{historyWord.correct_count}</div>
                                                <div className="text-sm text-gray-600">Correct</div>
                                            </div>
                                            <div className="bg-white border border-gray-200 rounded-lg p-4 text-center">
                                                <div className="text-2xl font-bold text-gray-900">
                                                    {historyWord.review_count > 0
                                                        ? Math.round((historyWord.correct_count / historyWord.review_count) * 100)
                                                        : 0}%
                                                </div>
                                                <div className="text-sm text-gray-600">Success Rate</div>
                                            </div>
                                            <div className="bg-white border border-gray-200 rounded-lg p-4 text-center">
                                                <div className="text-2xl font-bold text-gray-900">{historyWord.interval}d</div>
                                                <div className="text-sm text-gray-600">Next Interval</div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Review History Timeline */}
                                    <div className="p-8">
                                        <h3 className="text-2xl font-bold text-gray-900 mb-6">Review History</h3>

                                        {wordHistory.length === 0 ? (
                                            <div className="text-center py-12 text-gray-500">
                                                <p className="text-6xl mb-4">📭</p>
                                                <p className="text-xl font-semibold">Nog geen reviews voor dit woord</p>
                                            </div>
                                        ) : (
                                            <div className="space-y-4">
                                                {wordHistory.map((review, idx) => {
                                                    const qualityMap = {
                                                        0: { label: 'Again', emoji: '😰', color: 'from-red-500 to-red-600' },
                                                        3: { label: 'Hard', emoji: '😅', color: 'from-orange-500 to-orange-600' },
                                                        4: { label: 'Good', emoji: '😊', color: 'from-green-500 to-green-600' },
                                                        5: { label: 'Easy', emoji: '🎉', color: 'from-blue-500 to-blue-600' }
                                                    };
                                                    const quality = qualityMap[review.quality] || qualityMap[4];
                                                    const date = new Date(review.reviewed_at);

                                                    return (
                                                        <div
                                                            key={review.id}
                                                            className="bg-gradient-to-r from-gray-50 to-white border-l-4 border-blue-500 rounded-xl p-6 hover:shadow-lg transition-all"
                                                        >
                                                            <div className="flex items-center justify-between">
                                                                <div className="flex items-center gap-4">
                                                                    <div className={`bg-gradient-to-r ${quality.color} text-white px-6 py-3 rounded-xl font-bold text-lg flex items-center gap-2`}>
                                                                        <span className="text-2xl">{quality.emoji}</span>
                                                                        {quality.label}
                                                                    </div>
                                                                    <div className="text-left">
                                                                        <p className="text-gray-600 text-sm">
                                                                            {date.toLocaleDateString('nl-NL', {
                                                                                weekday: 'long',
                                                                                year: 'numeric',
                                                                                month: 'long',
                                                                                day: 'numeric'
                                                                            })}
                                                                        </p>
                                                                        <p className="text-gray-500 text-xs">
                                                                            {date.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' })}
                                                                        </p>
                                                                    </div>
                                                                </div>
                                                                <div className="flex gap-6 text-sm">
                                                                    <div className="text-center">
                                                                        <p className="text-gray-500">Interval voor</p>
                                                                        <p className="font-bold text-lg text-gray-700">{review.interval_before || 0}d</p>
                                                                    </div>
                                                                    <div className="text-3xl text-gray-300">→</div>
                                                                    <div className="text-center">
                                                                        <p className="text-gray-500">Interval na</p>
                                                                        <p className="font-bold text-lg text-blue-600">{review.interval_after}d</p>
                                                                    </div>
                                                                    <div className="text-center">
                                                                        <p className="text-gray-500">EF</p>
                                                                        <p className="font-bold text-lg text-purple-600">{review.easiness_factor_after.toFixed(2)}</p>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
