<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaans Leren - Voor Jacco 🇪🇸</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card-hover:hover {
            transform: translateY(-8px) scale(1.02);
        }
        
        .blob {
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            animation: blob 8s ease-in-out infinite;
        }
        
        @keyframes blob {
            0%, 100% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
            25% { border-radius: 58% 42% 75% 25% / 76% 46% 54% 24%; }
            50% { border-radius: 50% 50% 33% 67% / 55% 27% 73% 45%; }
            75% { border-radius: 33% 67% 58% 42% / 63% 68% 32% 37%; }
        }
        
        .shine {
            position: relative;
            overflow: hidden;
        }
        
        .shine::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }
        
        .shine:hover::before {
            left: 100%;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-50 via-blue-50 to-pink-50 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // API_BASE is now relative - Nginx reverse proxy handles routing
        const API_BASE = '/api';

        function App() {
            const [words, setWords] = useState([]);
            const [dueWords, setDueWords] = useState([]);
            const [loading, setLoading] = useState(false);
            const [activeTab, setActiveTab] = useState('add');
            const [searchTerm, setSearchTerm] = useState('');
            const [dutchWord, setDutchWord] = useState('');
            const [flashcardIndex, setFlashcardIndex] = useState(0);
            const [showAnswer, setShowAnswer] = useState(false);
            const [stats, setStats] = useState({ total_words: 0, total_categories: 0 });
            const [reviewStats, setReviewStats] = useState({ due_today: 0, learning: 0, mastered: 0, total_reviews_today: 0 });
            const [streakData, setStreakData] = useState({ current_streak: 0, longest_streak: 0 });
            const [heatmapData, setHeatmapData] = useState([]);
            const [selectedWord, setSelectedWord] = useState(null);
            const [notification, setNotification] = useState(null);
            const [seenToday, setSeenToday] = useState(0); // Track reviewed today
            const [dailyGoal, setDailyGoal] = useState(20); // Daily review goal
            const [sessionStartTime, setSessionStartTime] = useState(null); // Session timer
            const [wordHistory, setWordHistory] = useState(null); // Selected word history
            const [historyWord, setHistoryWord] = useState(null); // Word being viewed in history modal

            // Active recall state
            const [typeModeEnabled, setTypeModeEnabled] = useState(true); // Toggle type mode
            const [userAnswer, setUserAnswer] = useState(''); // User's typed answer
            const [isChecked, setIsChecked] = useState(false); // Has user checked their answer
            const [checkResult, setCheckResult] = useState(null); // 'correct', 'close', 'wrong'

            // Listening practice state
            const [listeningChallenge, setListeningChallenge] = useState(null); // Current challenge
            const [listeningAnswer, setListeningAnswer] = useState(''); // User's listening answer
            const [listeningFeedback, setListeningFeedback] = useState(null); // Feedback after check
            const [listeningLoading, setListeningLoading] = useState(false); // Loading new challenge

            // Quiz (Multiple Choice) state
            const [quizQuestion, setQuizQuestion] = useState(null); // Current quiz question
            const [quizSelectedOption, setQuizSelectedOption] = useState(null); // Selected option index
            const [quizFeedback, setQuizFeedback] = useState(null); // Feedback after check
            const [quizLoading, setQuizLoading] = useState(false); // Loading new question
            const [practiceMode, setPracticeMode] = useState(null); // 'listening', 'quiz', 'fillblank', or 'translate'

            // Fill-in-blank practice state
            const [fillBlankQuestion, setFillBlankQuestion] = useState(null);
            const [fillBlankAnswer, setFillBlankAnswer] = useState('');
            const [fillBlankFeedback, setFillBlankFeedback] = useState(null);
            const [fillBlankLoading, setFillBlankLoading] = useState(false);

            // Translation practice state
            const [translateQuestion, setTranslateQuestion] = useState(null);
            const [translateAnswer, setTranslateAnswer] = useState('');
            const [translateFeedback, setTranslateFeedback] = useState(null);
            const [translateLoading, setTranslateLoading] = useState(false);

            // Ref for input field auto-focus
            const dutchWordInputRef = useRef(null);
            const listeningInputRef = useRef(null);
            const reviewInputRef = useRef(null);

            // Helper function to insert Spanish character at cursor position (Listening Practice)
            const insertSpanishChar = (char) => {
                const input = listeningInputRef.current;
                if (!input) return;

                const start = input.selectionStart;
                const end = input.selectionEnd;
                const text = listeningAnswer;
                const before = text.substring(0, start);
                const after = text.substring(end);

                setListeningAnswer(before + char + after);

                // Set cursor position after inserted character
                setTimeout(() => {
                    input.focus();
                    input.setSelectionRange(start + 1, start + 1);
                }, 0);
            };

            // Helper function to insert Spanish character at cursor position (Review Type Mode)
            const insertSpanishCharReview = (char) => {
                const input = reviewInputRef.current;
                if (!input) return;

                const start = input.selectionStart;
                const end = input.selectionEnd;
                const text = userAnswer;
                const before = text.substring(0, start);
                const after = text.substring(end);

                setUserAnswer(before + char + after);

                // Set cursor position after inserted character
                setTimeout(() => {
                    input.focus();
                    input.setSelectionRange(start + 1, start + 1);
                }, 0);
            };

            // ESC key handler
            useEffect(() => {
                const handleEscape = (e) => {
                    if (e.key === 'Escape') {
                        if (historyWord) {
                            setHistoryWord(null);
                            setWordHistory(null);
                        } else if (selectedWord) {
                            closeModal();
                        }
                    }
                };
                window.addEventListener('keydown', handleEscape);
                return () => window.removeEventListener('keydown', handleEscape);
            }, [selectedWord, historyWord, activeTab]);

            useEffect(() => {
                if (activeTab === 'list' || activeTab === 'review') {
                    loadWords();
                }
                if (activeTab === 'review') {
                    loadDueWords();
                }
                if (activeTab === 'stats') {
                    loadHeatmap();
                }
                loadStats();
                loadReviewStats();
                loadStreak();
            }, [activeTab]);

            const loadWords = async () => {
                try {
                    const response = await fetch(`${API_BASE}/words/`);
                    const data = await response.json();
                    setWords(data);
                } catch (error) {
                    console.error('Error loading words:', error);
                }
            };

            const loadDueWords = async () => {
                try {
                    const response = await fetch(`${API_BASE}/words/due`);
                    const data = await response.json();
                    setDueWords(data);
                    if (data.length > 0) {
                        setFlashcardIndex(0);
                        setShowAnswer(false);
                    }
                } catch (error) {
                    console.error('Error loading due words:', error);
                }
            };

            const loadStats = async () => {
                try {
                    const response = await fetch(`${API_BASE}/stats/`);
                    const data = await response.json();
                    setStats(data);
                } catch (error) {
                    console.error('Error loading stats:', error);
                }
            };

            const loadReviewStats = async () => {
                try {
                    const response = await fetch(`${API_BASE}/stats/reviews`);
                    const data = await response.json();
                    setReviewStats(data);
                    setSeenToday(data.total_reviews_today);
                } catch (error) {
                    console.error('Error loading review stats:', error);
                }
            };

            const loadStreak = async () => {
                try {
                    const response = await fetch(`${API_BASE}/stats/streak`);
                    const data = await response.json();
                    setStreakData(data);
                } catch (error) {
                    console.error('Error loading streak:', error);
                }
            };

            const loadHeatmap = async () => {
                try {
                    const response = await fetch(`${API_BASE}/stats/heatmap?days=30`);
                    const data = await response.json();
                    setHeatmapData(data);
                } catch (error) {
                    console.error('Error loading heatmap:', error);
                }
            };

            const loadWordHistory = async (wordId) => {
                try {
                    // Get word details
                    const wordResponse = await fetch(`${API_BASE}/words/${wordId}`);
                    const wordData = await wordResponse.json();
                    setHistoryWord(wordData);

                    // Get history
                    const historyResponse = await fetch(`${API_BASE}/words/${wordId}/history`);
                    const historyData = await historyResponse.json();
                    setWordHistory(historyData);
                } catch (error) {
                    console.error('Error loading word history:', error);
                }
            };

            const playAudio = async (wordId) => {
                try {
                    const response = await fetch(`${API_BASE}/words/${wordId}/audio`);
                    const data = await response.json();

                    // Create and play audio from data URL
                    const audio = new Audio(data.audio_data);
                    await audio.play();
                } catch (error) {
                    console.error('Error playing audio:', error);
                    setNotification({ type: 'error', message: '🔊 Audio kon niet afgespeeld worden' });
                    setTimeout(() => setNotification(null), 3000);
                }
            };

            const getLeitnerBoxInfo = (box) => {
                const boxInfo = {
                    0: { label: 'Nieuw', emoji: '🆕', colors: 'from-gray-400 to-gray-500' },
                    1: { label: 'Leren', emoji: '📚', colors: 'from-red-400 to-red-500' },
                    2: { label: 'Bekend', emoji: '📖', colors: 'from-orange-400 to-orange-500' },
                    3: { label: 'Goed', emoji: '✅', colors: 'from-yellow-400 to-yellow-500' },
                    4: { label: 'Sterk', emoji: '💪', colors: 'from-green-400 to-green-500' },
                    5: { label: 'Meester', emoji: '🏆', colors: 'from-blue-400 to-blue-500' }
                };
                return boxInfo[box] || boxInfo[0];
            };

            const loadListeningChallenge = async () => {
                setListeningLoading(true);
                setListeningFeedback(null);
                setListeningAnswer('');

                try {
                    const response = await fetch(`${API_BASE}/practice/listening`);
                    const data = await response.json();
                    setListeningChallenge(data);
                } catch (error) {
                    console.error('Error loading listening challenge:', error);
                    setNotification({ type: 'error', message: '❌ Kon geen luisteroefening laden' });
                    setTimeout(() => setNotification(null), 3000);
                } finally {
                    setListeningLoading(false);
                }
            };

            const checkListeningAnswer = async () => {
                if (!listeningAnswer.trim()) {
                    setNotification({ type: 'error', message: 'Voer eerst een antwoord in! 📝' });
                    setTimeout(() => setNotification(null), 3000);
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE}/practice/listening/check`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            word_id: listeningChallenge.word_id,
                            user_answer: listeningAnswer
                        })
                    });

                    const feedback = await response.json();
                    setListeningFeedback(feedback);
                } catch (error) {
                    console.error('Error checking answer:', error);
                    setNotification({ type: 'error', message: '❌ Kon antwoord niet checken' });
                    setTimeout(() => setNotification(null), 3000);
                }
            };

            // Quiz (Multiple Choice) functions
            const loadQuizQuestion = async () => {
                setQuizLoading(true);
                setQuizFeedback(null);
                setQuizSelectedOption(null);

                try {
                    const response = await fetch(`${API_BASE}/practice/quiz`);
                    const data = await response.json();
                    setQuizQuestion(data);
                } catch (error) {
                    console.error('Error loading quiz question:', error);
                    setNotification({ type: 'error', message: '❌ Kon geen quiz vraag laden' });
                    setTimeout(() => setNotification(null), 3000);
                } finally {
                    setQuizLoading(false);
                }
            };

            const checkQuizAnswer = async () => {
                if (quizSelectedOption === null) {
                    setNotification({ type: 'error', message: 'Selecteer eerst een antwoord! 📝' });
                    setTimeout(() => setNotification(null), 3000);
                    return;
                }

                const selectedAnswer = quizQuestion.options[quizSelectedOption];

                try {
                    const response = await fetch(`${API_BASE}/practice/quiz/check`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            word_id: quizQuestion.word_id,
                            selected_answer: selectedAnswer,
                            correct_answer: quizQuestion.correct_answer
                        })
                    });

                    const feedback = await response.json();
                    setQuizFeedback(feedback);

                    // Haal het volledige woord op om de modal te tonen
                    const wordResponse = await fetch(`${API_BASE}/words/${quizQuestion.word_id}`);
                    const wordData = await wordResponse.json();

                    // Toon de modal met het volledige woord na 1 seconde (zodat gebruiker eerst feedback ziet)
                    setTimeout(() => {
                        setSelectedWord(wordData);
                    }, 1500);
                } catch (error) {
                    console.error('Error checking quiz answer:', error);
                    setNotification({ type: 'error', message: '❌ Kon antwoord niet checken' });
                    setTimeout(() => setNotification(null), 3000);
                }
            };

            // Fill-in-blank practice functions
            const loadFillBlankQuestion = async () => {
                setFillBlankLoading(true);
                setFillBlankFeedback(null);
                setFillBlankAnswer('');

                try {
                    const response = await fetch(`${API_BASE}/practice/fill-blank`);
                    const data = await response.json();
                    setFillBlankQuestion(data);
                } catch (error) {
                    console.error('Error loading fill-blank question:', error);
                    setNotification({ type: 'error', message: '❌ Kon geen vraag laden' });
                    setTimeout(() => setNotification(null), 3000);
                } finally {
                    setFillBlankLoading(false);
                }
            };

            const checkFillBlankAnswer = async () => {
                if (!fillBlankAnswer.trim()) {
                    setNotification({ type: 'error', message: 'Vul eerst een antwoord in! ✏️' });
                    setTimeout(() => setNotification(null), 3000);
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE}/practice/fill-blank/check`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            word_id: fillBlankQuestion.word_id,
                            user_answer: fillBlankAnswer,
                            correct_answer: fillBlankQuestion.correct_answer
                        })
                    });

                    const feedback = await response.json();
                    setFillBlankFeedback(feedback);
                } catch (error) {
                    console.error('Error checking fill-blank answer:', error);
                    setNotification({ type: 'error', message: '❌ Kon antwoord niet checken' });
                    setTimeout(() => setNotification(null), 3000);
                }
            };

            // Translation practice functions
            const loadTranslateQuestion = async () => {
                setTranslateLoading(true);
                setTranslateFeedback(null);
                setTranslateAnswer('');

                try {
                    const response = await fetch(`${API_BASE}/practice/translate`);
                    const data = await response.json();
                    setTranslateQuestion(data);
                } catch (error) {
                    console.error('Error loading translation question:', error);
                    setNotification({ type: 'error', message: '❌ Kon geen vertaalvraag laden' });
                    setTimeout(() => setNotification(null), 3000);
                } finally {
                    setTranslateLoading(false);
                }
            };

            const checkTranslateAnswer = async () => {
                if (!translateAnswer.trim()) {
                    setNotification({ type: 'error', message: 'Vul eerst een vertaling in! 🌐' });
                    setTimeout(() => setNotification(null), 3000);
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE}/practice/translate/check`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            word_id: translateQuestion.word_id,
                            user_translation: translateAnswer,
                            correct_translation: translateQuestion.correct_answer
                        })
                    });

                    const feedback = await response.json();
                    setTranslateFeedback(feedback);
                } catch (error) {
                    console.error('Error checking translation:', error);
                    setNotification({ type: 'error', message: '❌ Kon vertaling niet checken' });
                    setTimeout(() => setNotification(null), 3000);
                }
            };

            const handleAddWord = async (e) => {
                e.preventDefault();
                if (!dutchWord.trim()) {
                    setNotification({ type: 'error', message: 'Voer een Nederlands woord in! 📝' });
                    setTimeout(() => setNotification(null), 3000);
                    return;
                }

                setLoading(true);
                try {
                    const response = await fetch(`${API_BASE}/words/`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ dutch_word: dutchWord })
                    });

                    if (!response.ok) throw new Error('API request failed');

                    const newWord = await response.json();

                    // Check if duplicate or new word
                    if (newWord.is_duplicate) {
                        // Duplicate word - show info notification
                        setNotification({
                            type: 'info',
                            message: `ℹ️ "${newWord.spanish_word}" bestaat al! Bekijk de visualisatie 👇`
                        });
                        // Don't add to list (avoid UI duplicates)
                    } else {
                        // New word - add to list
                        setWords([newWord, ...words]);
                        setNotification({
                            type: 'success',
                            message: `✨ "${newWord.spanish_word}" toegevoegd! Bekijk de visualisatie 👇`
                        });
                    }

                    setDutchWord('');
                    setTimeout(() => setNotification(null), 5000);

                    // Always show visualization modal (stay in 'add' tab)
                    setSelectedWord(newWord);
                } catch (error) {
                    console.error('Error adding word:', error);
                    setNotification({ type: 'error', message: '❌ Fout bij toevoegen. Check de backend!' });
                    setTimeout(() => setNotification(null), 3000);
                } finally {
                    setLoading(false);
                }
            };

            const handleDeleteWord = async (id) => {
                if (!confirm('🗑️ Weet je zeker dat je dit woord wilt verwijderen?')) return;
                try {
                    await fetch(`${API_BASE}/words/${id}`, { method: 'DELETE' });
                    setWords(words.filter(w => w.id !== id));
                } catch (error) {
                    console.error('Error deleting word:', error);
                }
            };

            const filteredWords = words.filter(word =>
                word.dutch_word.toLowerCase().includes(searchTerm.toLowerCase()) ||
                word.spanish_word.toLowerCase().includes(searchTerm.toLowerCase())
            );

            const closeModal = () => {
                setSelectedWord(null);

                // If we're in quiz mode, load a new question instead of going to add tab
                if (activeTab === 'practice' && practiceMode === 'quiz' && quizFeedback) {
                    // Reset feedback and load new question
                    setQuizFeedback(null);
                    setQuizSelectedOption(null);
                    loadQuizQuestion();
                } else {
                    // Default behavior: return to 'add' tab and focus input field
                    setActiveTab('add');
                    setTimeout(() => {
                        dutchWordInputRef.current?.focus();
                    }, 100);
                }
            };

            const startReview = () => {
                loadDueWords();
                setActiveTab('review');
                // Reset answer state
                setUserAnswer('');
                setIsChecked(false);
                setCheckResult(null);
            };

            // Levenshtein distance for fuzzy matching
            const levenshteinDistance = (str1, str2) => {
                const track = Array(str2.length + 1).fill(null).map(() =>
                    Array(str1.length + 1).fill(null));
                for (let i = 0; i <= str1.length; i += 1) {
                    track[0][i] = i;
                }
                for (let j = 0; j <= str2.length; j += 1) {
                    track[j][0] = j;
                }
                for (let j = 1; j <= str2.length; j += 1) {
                    for (let i = 1; i <= str1.length; i += 1) {
                        const indicator = str1[i - 1] === str2[j - 1] ? 0 : 1;
                        track[j][i] = Math.min(
                            track[j][i - 1] + 1,
                            track[j - 1][i] + 1,
                            track[j - 1][i - 1] + indicator,
                        );
                    }
                }
                return track[str2.length][str1.length];
            };

            const checkAnswer = () => {
                if (!dueWords[flashcardIndex]) return;

                const correctAnswer = dueWords[flashcardIndex].spanish_word.toLowerCase().trim();
                const userAttempt = userAnswer.toLowerCase().trim();

                // Exact match
                if (userAttempt === correctAnswer) {
                    setCheckResult('correct');
                    setIsChecked(true);
                    setShowAnswer(true);
                    return;
                }

                // Fuzzy match - allow 1-2 character difference
                const distance = levenshteinDistance(userAttempt, correctAnswer);
                const maxAllowedDistance = correctAnswer.length <= 4 ? 1 : 2;

                if (distance <= maxAllowedDistance) {
                    setCheckResult('close');
                } else {
                    setCheckResult('wrong');
                }

                setIsChecked(true);
                setShowAnswer(true);
            };

            const submitReview = async (quality) => {
                if (dueWords.length === 0) return;

                const currentWord = dueWords[flashcardIndex];
                try {
                    const response = await fetch(`${API_BASE}/reviews/`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            word_id: currentWord.id,
                            quality: quality
                        })
                    });

                    if (!response.ok) throw new Error('Failed to submit review');

                    // Update stats
                    await loadReviewStats();
                    await loadStreak();

                    // Remove reviewed word from due list
                    const newDueWords = dueWords.filter((_, i) => i !== flashcardIndex);
                    setDueWords(newDueWords);

                    // Reset answer state for next card
                    setUserAnswer('');
                    setIsChecked(false);
                    setCheckResult(null);
                    setShowAnswer(false);

                    // Move to next card or show completion
                    if (newDueWords.length > 0) {
                        setFlashcardIndex(0);
                    } else {
                        // All done!
                        setNotification({
                            type: 'success',
                            message: '🎉 Alle kaarten voor vandaag gedaan! Goed bezig! 🔥'
                        });
                        setTimeout(() => {
                            setNotification(null);
                            setActiveTab('stats');
                        }, 3000);
                    }
                } catch (error) {
                    console.error('Error submitting review:', error);
                    setNotification({ type: 'error', message: '❌ Fout bij opslaan review' });
                    setTimeout(() => setNotification(null), 3000);
                }
            };

            return (
                <div className="min-h-screen pb-12">
                    {/* Hero Header met gradient */}
                    <div className="gradient-bg text-white py-8 px-4 shadow-2xl relative overflow-hidden">
                        {/* Decoratieve blobs */}
                        <div className="absolute top-0 right-0 w-64 h-64 bg-white opacity-10 blob"></div>
                        <div className="absolute bottom-0 left-0 w-48 h-48 bg-white opacity-10 blob" style={{animationDelay: '2s'}}></div>
                        
                        <div className="max-w-6xl mx-auto relative z-10">
                            <div className="flex items-center gap-4 mb-4">
                                <span className="text-6xl">🇪🇸</span>
                                <div>
                                    <h1 className="text-5xl font-black mb-2">Spaans Leren</h1>
                                    <p className="text-xl opacity-90 font-medium">met AI-powered geheugensteun 🧠✨</p>
                                </div>
                            </div>
                            
                            <div className="flex gap-4 flex-wrap mt-6">
                                <div className="bg-white bg-opacity-20 backdrop-blur-sm px-6 py-3 rounded-full flex items-center gap-3 shine">
                                    <span className="text-3xl">📚</span>
                                    <div>
                                        <p className="text-sm opacity-75">Woorden geleerd</p>
                                        <p className="text-2xl font-bold">{stats.total_words}</p>
                                    </div>
                                </div>
                                <div className="bg-white bg-opacity-20 backdrop-blur-sm px-6 py-3 rounded-full flex items-center gap-3 shine">
                                    <span className="text-3xl">🔥</span>
                                    <div>

                                                        </div>
                                                        <div className="bg-gradient-to-br from-green-50 to-emerald-50 p-6 rounded-xl">
                                                            <span className="block text-sm font-semibold text-gray-600 mb-1">Vrouwelijk</span>
                                                            <span className="text-2xl text-green-600 font-bold">{selectedWord.forms.feminine}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                        {/* Als geen conjugations of forms */}
                                        {!selectedWord.conjugations && !selectedWord.forms && (
                                            <p className="text-gray-500 text-center italic">
                                                ⚠️ Geen grammatica informatie beschikbaar voor dit woord.
                                            </p>
                                        )}
                                    </div>

                                    {/* Grammar Tips Section */}
                                    {selectedWord.grammar_tips && (
                                        <div className="mt-6 bg-gradient-to-r from-yellow-50 to-orange-50 rounded-3xl shadow-xl p-8 max-w-3xl mx-auto">
                                            <h3 className="text-2xl font-bold text-orange-600 mb-6 flex items-center gap-2">
                                                💡 Grammatica Tips
                                            </h3>

                                            {/* Usage Rules */}
                                            {selectedWord.grammar_tips.usage_rules && selectedWord.grammar_tips.usage_rules.length > 0 && (
                                                <div className="mb-6">
                                                    <h4 className="text-lg font-semibold text-gray-800 mb-3 flex items-center gap-2">
                                                        📋 Gebruiksregels
                                                    </h4>
                                                    <ul className="space-y-2">
                                                        {selectedWord.grammar_tips.usage_rules.map((rule, index) => (
                                                            <li key={index} className="flex items-start gap-3 bg-white rounded-lg p-3">
                                                                <span className="text-green-500 flex-shrink-0">✓</span>
                                                                <span className="text-gray-700">{rule}</span>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                </div>
                                            )}

                                            {/* Common Mistakes */}
                                            {selectedWord.grammar_tips.common_mistakes && selectedWord.grammar_tips.common_mistakes.length > 0 && (
                                                <div className="mb-6">
                                                    <h4 className="text-lg font-semibold text-gray-800 mb-3 flex items-center gap-2">
                                                        ⚠️ Veelgemaakte Fouten
                                                    </h4>
                                                    <ul className="space-y-2">
                                                        {selectedWord.grammar_tips.common_mistakes.map((mistake, index) => (
                                                            <li key={index} className="flex items-start gap-3 bg-white rounded-lg p-3">
                                                                <span className="text-red-500 flex-shrink-0">⚡</span>
                                                                <span className="text-gray-700">{mistake}</span>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                </div>
                                            )}

                                            {/* Helpful Tips */}
                                            {selectedWord.grammar_tips.tips && selectedWord.grammar_tips.tips.length > 0 && (
                                                <div>
                                                    <h4 className="text-lg font-semibold text-gray-800 mb-3 flex items-center gap-2">
                                                        🎯 Handige Tips
                                                    </h4>
                                                    <ul className="space-y-2">
                                                        {selectedWord.grammar_tips.tips.map((tip, index) => (
                                                            <li key={index} className="flex items-start gap-3 bg-white rounded-lg p-3">
                                                                <span className="text-blue-500 flex-shrink-0">💡</span>
                                                                <span className="text-gray-700">{tip}</span>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* Voorbeeldzinnen */}
                                    {selectedWord.example_sentences && selectedWord.example_sentences.length > 0 && (
                                        <div className="mt-6 bg-gradient-to-r from-indigo-50 to-purple-50 rounded-3xl shadow-xl p-8 max-w-3xl mx-auto">
                                            <h3 className="text-2xl font-bold text-indigo-600 mb-6 flex items-center gap-2">
                                                📚 Voorbeeldzinnen
                                            </h3>
                                            <div className="space-y-4">
                                                {selectedWord.example_sentences.map((sentence, index) => {
                                                    const difficultyColors = {
                                                        basic: 'bg-green-100 text-green-800',
                                                        intermediate: 'bg-yellow-100 text-yellow-800',
                                                        advanced: 'bg-red-100 text-red-800'
                                                    };
                                                    const difficultyLabels = {
                                                        basic: 'Basis',
                                                        intermediate: 'Gemiddeld',
                                                        advanced: 'Gevorderd'
                                                    };
                                                    const difficulty = sentence.difficulty || 'basic';

                                                    return (
                                                        <div key={index} className="bg-white rounded-xl p-5 shadow-md">
                                                            <div className="flex items-start justify-between gap-3 mb-2">
                                                                <div className="flex items-start gap-3 flex-1">
                                                                    <span className="text-2xl flex-shrink-0">🇪🇸</span>
                                                                    <p className="text-lg font-semibold text-gray-800">{sentence.spanish}</p>
                                                                </div>
                                                                <span className={`px-3 py-1 rounded-full text-xs font-semibold ${difficultyColors[difficulty]}`}>
                                                                    {difficultyLabels[difficulty]}
                                                                </span>
                                                            </div>
                                                            <div className="flex items-start gap-3 ml-8">
                                                                <span className="text-sm text-gray-600 italic">{sentence.dutch}</span>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    {/* Gerelateerde Woorden */}
                                    {selectedWord.related_words && (
                                        <div className="mt-6 bg-gradient-to-r from-green-50 to-emerald-50 rounded-3xl shadow-xl p-8 max-w-3xl mx-auto">
                                            <h3 className="text-2xl font-bold text-green-600 mb-6 flex items-center gap-2">
                                                🔗 Gerelateerde Woorden
                                            </h3>
                                            <div className="space-y-4">
                                                {selectedWord.related_words.synonyms && selectedWord.related_words.synonyms.length > 0 && (
                                                    <div className="bg-white rounded-xl p-5 shadow-md">
                                                        <h4 className="text-lg font-bold text-gray-700 mb-3 flex items-center gap-2">
                                                            <span className="text-2xl">🔄</span> Synoniemen
                                                        </h4>
                                                        <div className="flex flex-wrap gap-2">
                                                            {selectedWord.related_words.synonyms.map((word, index) => (
                                                                <span key={index} className="bg-gradient-to-r from-blue-100 to-cyan-100 text-blue-700 px-4 py-2 rounded-full font-semibold text-sm">
                                                                    {word}
                                                                </span>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}

                                                {selectedWord.related_words.antonyms && selectedWord.related_words.antonyms.length > 0 && (
                                                    <div className="bg-white rounded-xl p-5 shadow-md">
                                                        <h4 className="text-lg font-bold text-gray-700 mb-3 flex items-center gap-2">
                                                            <span className="text-2xl">⚖️</span> Antoniemen
                                                        </h4>
                                                        <div className="flex flex-wrap gap-2">
                                                            {selectedWord.related_words.antonyms.map((word, index) => (
                                                                <span key={index} className="bg-gradient-to-r from-orange-100 to-red-100 text-red-700 px-4 py-2 rounded-full font-semibold text-sm">
                                                                    {word}
                                                                </span>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}

                                                {selectedWord.related_words.family && selectedWord.related_words.family.length > 0 && (
                                                    <div className="bg-white rounded-xl p-5 shadow-md">
                                                        <h4 className="text-lg font-bold text-gray-700 mb-3 flex items-center gap-2">
                                                            <span className="text-2xl">👨‍👩‍👧‍👦</span> Woordfamilie
                                                        </h4>
                                                        <div className="flex flex-wrap gap-2">
                                                            {selectedWord.related_words.family.map((word, index) => (
                                                                <span key={index} className="bg-gradient-to-r from-purple-100 to-pink-100 text-purple-700 px-4 py-2 rounded-full font-semibold text-sm">
                                                                    {word}
                                                                </span>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}

                                    <div className="mt-6 text-center">
                                        <p className="text-white text-lg font-semibold bg-black bg-opacity-50 backdrop-blur-md px-6 py-3 rounded-full inline-block">
                                            💡 Klik ergens of druk <kbd className="bg-white text-black px-2 py-1 rounded font-mono">ESC</kbd> om te sluiten
                                        </p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Notificatie - bovenaan scherm */}
                        {notification && (
                            <div
                                className={`fixed top-8 left-1/2 transform -translate-x-1/2 z-50 px-8 py-4 rounded-2xl shadow-2xl font-semibold text-lg max-w-2xl cursor-pointer transition-all hover:scale-105 ${
                                    notification.type === 'success'
                                        ? 'bg-gradient-to-r from-green-500 to-emerald-500 text-white'
                                        : notification.type === 'info'
                                        ? 'bg-gradient-to-r from-blue-500 to-cyan-500 text-white'
                                        : 'bg-gradient-to-r from-red-500 to-pink-500 text-white'
                                }`}
                                onClick={() => setNotification(null)}
                            >
                                {notification.message}
                            </div>
                        )}

                        {/* History Modal */}
                        {historyWord && wordHistory && (
                            <div
                                className="fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center z-50 p-8 backdrop-blur-sm overflow-y-auto"
                                onClick={() => {
                                    setHistoryWord(null);
                                    setWordHistory(null);
                                }}
                            >
                                <div
                                    className="relative max-w-4xl w-full my-8 bg-white rounded-3xl shadow-2xl overflow-hidden"
                                    onClick={(e) => e.stopPropagation()}
                                >
                                    {/* Header */}
                                    <div className="bg-gradient-to-r from-blue-500 to-purple-500 text-white p-8">
                                        <div className="flex items-center justify-between mb-4">
                                            <div className="flex items-center gap-4">
                                                <div>
                                                    <h2 className="text-4xl font-black mb-2">{historyWord.spanish_word}</h2>
                                                    <p className="text-2xl opacity-90">{historyWord.dutch_word}</p>
                                                </div>
                                                <button
                                                    onClick={() => playAudio(historyWord.id)}
                                                    className="text-4xl hover:scale-110 transition-transform bg-white bg-opacity-20 hover:bg-opacity-30 px-4 py-2 rounded-xl"
                                                    title="Luister uitspraak"
                                                >
                                                    🔊
                                                </button>
                                            </div>
                                            <button
                                                onClick={() => {
                                                    setHistoryWord(null);
                                                    setWordHistory(null);
                                                }}
                                                className="bg-white bg-opacity-20 hover:bg-opacity-30 px-6 py-3 rounded-xl font-bold text-2xl transition-all"
                                            >
                                                ✖️
                                            </button>
                                        </div>

                                        {/* Quick Stats */}
                                        <div className="grid grid-cols-4 gap-4 mt-6">
                                            <div className="bg-white bg-opacity-20 rounded-2xl p-4 text-center">
                                                <div className="text-3xl font-black">{historyWord.review_count}</div>
                                                <div className="text-sm opacity-90">Total Reviews</div>
                                            </div>
                                            <div className="bg-white bg-opacity-20 rounded-2xl p-4 text-center">
                                                <div className="text-3xl font-black">{historyWord.correct_count}</div>
                                                <div className="text-sm opacity-90">Correct</div>
                                            </div>
                                            <div className="bg-white bg-opacity-20 rounded-2xl p-4 text-center">
                                                <div className="text-3xl font-black">
                                                    {historyWord.review_count > 0
                                                        ? Math.round((historyWord.correct_count / historyWord.review_count) * 100)
                                                        : 0}%
                                                </div>
                                                <div className="text-sm opacity-90">Success Rate</div>
                                            </div>
                                            <div className="bg-white bg-opacity-20 rounded-2xl p-4 text-center">
                                                <div className="text-3xl font-black">{historyWord.interval}d</div>
                                                <div className="text-sm opacity-90">Next Interval</div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Review History Timeline */}
                                    <div className="p-8">
                                        <h3 className="text-3xl font-black gradient-text mb-6">📈 Review History</h3>

                                        {wordHistory.length === 0 ? (
                                            <div className="text-center py-12 text-gray-500">
                                                <p className="text-6xl mb-4">📭</p>
                                                <p className="text-xl font-semibold">Nog geen reviews voor dit woord</p>
                                            </div>
                                        ) : (
                                            <div className="space-y-4">
                                                {wordHistory.map((review, idx) => {
                                                    const qualityMap = {
                                                        0: { label: 'Again', emoji: '😰', color: 'from-red-500 to-red-600' },
                                                        3: { label: 'Hard', emoji: '😅', color: 'from-orange-500 to-orange-600' },
                                                        4: { label: 'Good', emoji: '😊', color: 'from-green-500 to-green-600' },
                                                        5: { label: 'Easy', emoji: '🎉', color: 'from-blue-500 to-blue-600' }
                                                    };
                                                    const quality = qualityMap[review.quality] || qualityMap[4];
                                                    const date = new Date(review.reviewed_at);

                                                    return (
                                                        <div
                                                            key={review.id}
                                                            className="bg-gradient-to-r from-gray-50 to-white border-l-4 border-blue-500 rounded-xl p-6 hover:shadow-lg transition-all"
                                                        >
                                                            <div className="flex items-center justify-between">
                                                                <div className="flex items-center gap-4">
                                                                    <div className={`bg-gradient-to-r ${quality.color} text-white px-6 py-3 rounded-xl font-bold text-lg flex items-center gap-2`}>
                                                                        <span className="text-2xl">{quality.emoji}</span>
                                                                        {quality.label}
                                                                    </div>
                                                                    <div className="text-left">
                                                                        <p className="text-gray-600 text-sm">
                                                                            {date.toLocaleDateString('nl-NL', {
                                                                                weekday: 'long',
                                                                                year: 'numeric',
                                                                                month: 'long',
                                                                                day: 'numeric'
                                                                            })}
                                                                        </p>
                                                                        <p className="text-gray-500 text-xs">
                                                                            {date.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' })}
                                                                        </p>
                                                                    </div>
                                                                </div>
                                                                <div className="flex gap-6 text-sm">
                                                                    <div className="text-center">
                                                                        <p className="text-gray-500">Interval voor</p>
                                                                        <p className="font-bold text-lg text-gray-700">{review.interval_before || 0}d</p>
                                                                    </div>
                                                                    <div className="text-3xl text-gray-300">→</div>
                                                                    <div className="text-center">
                                                                        <p className="text-gray-500">Interval na</p>
                                                                        <p className="font-bold text-lg text-blue-600">{review.interval_after}d</p>
                                                                    </div>
                                                                    <div className="text-center">
                                                                        <p className="text-gray-500">EF</p>
                                                                        <p className="font-bold text-lg text-purple-600">{review.easiness_factor_after.toFixed(2)}</p>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
